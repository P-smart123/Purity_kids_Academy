    </div>

    <div class="rc-section-title">Practical Skills (Grade A–E):</div>
    <div class="field-row" style="flex-wrap:wrap;">
      ${PRACTICAL_SKILLS.map(t=>`<div class="field" style="min-width:220px;"><label>${esc(t)}</label>${gradeSelectHtml(t, practicalVals[t])}</div>`).join("")}
    </div>

    <div class="rc-section-title">Psychomotor Skills — Nursery/Primary/Creche (Grade A–E):</div>
    <div class="field-row" style="flex-wrap:wrap;">
      ${PSYCHOMOTOR_SKILLS.map(t=>`<div class="field" style="min-width:220px;"><label>${esc(t)}</label>${gradeSelectHtml(t, psychomotorVals[t])}</div>`).join("")}
    </div>

    <div class="field-row">
      <div class="field"><label>Award / Prize Won (optional)</label><input id="rm-award" value="${esc(existing.award||'')}" ${isClassTeacher?'':'disabled'}></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Date of Vacation</label><input type="date" id="rm-vacation" value="${existing.vacationDate||''}" ${isClassTeacher?'':'disabled'}></div>
      <div class="field"><label>Date of Resumption (next term)</label><input type="date" id="rm-resumption" value="${existing.resumptionDate||''}" ${isClassTeacher?'':'disabled'}></div>
    </div>

    ${isThirdTerm ? `
    <div class="rc-section-title">Third Term Promotion:</div>
    <div class="field"><label>Promoted To (class name, or "Repeat")</label><input id="rm-promotion" value="${esc(existing.promotion||'')}" placeholder="e.g. JSS 2A, or Repeat JSS 1A" ${isClassTeacher?'':'disabled'}></div>
    ` : ``}

    <div class="rc-section-title">Class Teacher's Remark (dropdown suggestion, or type your own):</div>
    <div class="field">${isClassTeacher ? remarkPickerHtml('teacher','rm-teacher', existing.teacherRemark||'') : `<textarea rows="2" disabled>${esc(existing.teacherRemark||'(Not entered)')}</textarea>`}</div>

    <div class="rc-section-title">Principal's Remark (dropdown suggestion, or type your own):</div>
    <div class="field">${isPrincipal ? remarkPickerHtml('principal','rm-principal', existing.principalRemark||'') : `<textarea rows="2" disabled>${esc(existing.principalRemark||'(Not entered)')}</textarea>`}</div>

    <div class="rc-section-title">Guidance Counsellor's Remark (dropdown suggestion, or type your own):</div>
    <div class="field">${isPrincipal ? remarkPickerHtml('guidance','rm-guidance', existing.guidanceRemark||'') : `<textarea rows="2" disabled>${esc(existing.guidanceRemark||'(Not entered)')}</textarea>`}</div>

    <div class="modal-actions"><button class="btn btn-outline" id="rm-cancel">Cancel</button><button class="btn btn-primary" id="rm-save">Save Term Record</button></div>`,
    body=>{
      if(isClassTeacher) wireRemarkPicker('rm-teacher', body);
      if(isPrincipal){ wireRemarkPicker('rm-principal', body); wireRemarkPicker('rm-guidance', body); }

      $("#rm-cancel",body).onclick = closeModal;
      $("#rm-save",body).onclick = async ()=>{
        const payload = { studentId, sessionId, term, updatedAt: nowStamp() };

        if(isClassTeacher){
          payload.attendancePresent = parseInt($("#rm-present",body).value)||0;
          payload.attendanceTotal = parseInt($("#rm-total",body).value)||0;
          payload.award = $("#rm-award",body).value.trim();
          payload.vacationDate = $("#rm-vacation",body).value;
          payload.resumptionDate = $("#rm-resumption",body).value;
          payload.teacherRemark = getRemarkValue('rm-teacher', body);

          const cd = {}; CHARACTER_TRAITS.forEach(t=>{ const v = $(`select[data-trait="${t}"]`, body); if(v && v.value) cd[t]=v.value; });
          payload.characterDevelopment = cd;

          const ps = {}; PRACTICAL_SKILLS.forEach(t=>{ const v = $all(`select[data-trait]`, body).find(el=>el.dataset.trait===t); if(v && v.value) ps[t]=v.value; });
          payload.practicalSkills = ps;

          const pm = {}; PSYCHOMOTOR_SKILLS.forEach(t=>{ const v = $all(`select[data-trait]`, body).find(el=>el.dataset.trait===t); if(v && v.value) pm[t]=v.value; });
          payload.psychomotorSkills = pm;

          if(isThirdTerm){
            const promoEl = $("#rm-promotion", body);
            if(promoEl) payload.promotion = promoEl.value.trim();
          }
        }

        if(isPrincipal){
          payload.principalRemark = getRemarkValue('rm-principal', body);
          payload.guidanceRemark = getRemarkValue('rm-guidance', body);
        }

        await db.collection("termRemarks").doc(`${studentId}_${sessionId}_${term}`).set(payload, {merge:true});
        await logAudit("save_term_record", {studentId, term});
        closeModal(); toast("Term record saved","success"); onSaved();
      };
    });
}

async function publishStudentResult(studentId, session, term, group, position, tr){
  const studentDoc = await db.collection("students").doc(studentId).get();
  const student = studentDoc.data();
  const totalInClassSnap = await db.collection("students").where("classId","==",student.classId).get();
  const totalInClass = totalInClassSnap.docs.filter(d=> (d.data().status||'active')!=='archived').length;

  const batch = db.batch();
  group.subjects.forEach(s=> batch.update(db.collection("results").doc(s.id), {status:"published", publishedAt: nowStamp()}));
  batch.set(db.collection("termRemarks").doc(`${studentId}_${session.id}_${term}`), {status:"published", position, publishedAt: nowStamp()}, {merge:true});
  await batch.commit();

  const publicId = `${student.admissionNo}_${student.pin}_${session.name}_${term}`.replace(/\s+/g,"");
  await db.collection("publicResults").doc(publicId).set({
    studentId, studentName: student.fullName, admissionNo: student.admissionNo,
    className: student.className, section: student.section, house: student.house || "",
    sessionId: session.id, sessionName: session.name, term, position, totalInClass,
    subjects: group.subjects.map(s=>({subjectName:s.subjectName, test1:s.test1, test2:s.test2, test3:s.test3, exam:s.exam, bf:s.bf||0, total:s.total, cumScore:s.cumScore ?? s.total, grade:s.grade})),
    teacherRemark: tr.teacherRemark || "", principalRemark: tr.principalRemark || "", guidanceRemark: tr.guidanceRemark || "",
    attendancePresent: tr.attendancePresent||0, attendanceTotal: tr.attendanceTotal||0,
    characterDevelopment: tr.characterDevelopment || {}, practicalSkills: tr.practicalSkills || {}, psychomotorSkills: tr.psychomotorSkills || {},
    award: tr.award || "", vacationDate: tr.vacationDate || "", resumptionDate: tr.resumptionDate || "",
    promotion: tr.promotion || "",
    publishedAt: nowStamp(), publicId
  });
  await logAudit("publish_result", {studentId, term, publicId});
}

/* =========================================================================
   22. REPORT CARD RENDERING
   ========================================================================= */
async function renderReportCardRoute(content){
  const parts = location.hash.replace("#/report/","").split("/");
  const studentId = parts[0];
  const studentDoc = await db.collection("students").doc(studentId).get();
  if(!studentDoc.exists){ content.innerHTML = `<div class="empty-state">Student not found.</div>`; return; }
  const student = studentDoc.data();
  const session = await getCurrentSession();
  const term = state.currentTerm;
  const [resultsSnap, trDoc, totalInClassSnap] = await Promise.all([
    db.collection("results").where("studentId","==",studentId).where("sessionId","==",session.id).where("term","==",term).get(),
    db.collection("termRemarks").doc(`${studentId}_${session.id}_${term}`).get(),
    db.collection("students").where("classId","==",student.classId).get()
  ]);
  const subjects = resultsSnap.docs.map(d=>d.data());
  const tr = trDoc.exists ? trDoc.data() : {};
  const totalInClass = totalInClassSnap.docs.filter(d=> (d.data().status||'active')!=='archived').length;
  const data = {
    studentName: student.fullName, admissionNo: student.admissionNo, className: student.className, section: student.section,
    house: student.house || "", totalInClass,
    sessionName: session.name, term, position: tr.position || "—",
    subjects: subjects.map(s=>({subjectName:s.subjectName, test1:s.test1, test2:s.test2, test3:s.test3, exam:s.exam, bf:s.bf||0, total:s.total, cumScore:s.cumScore ?? s.total, grade:s.grade})),
    teacherRemark: tr.teacherRemark || "(Not yet entered by class teacher)",
    principalRemark: tr.principalRemark || "(Not yet entered by Principal)",
    guidanceRemark: tr.guidanceRemark || "(Not yet entered)",
    attendancePresent: tr.attendancePresent||0, attendanceTotal: tr.attendanceTotal||0,
    characterDevelopment: tr.characterDevelopment || {}, practicalSkills: tr.practicalSkills || {}, psychomotorSkills: tr.psychomotorSkills || {},
    award: tr.award || "", vacationDate: tr.vacationDate || "", resumptionDate: tr.resumptionDate || "",
    promotion: tr.promotion || "",
    publicId: `${student.admissionNo}_${student.pin}_${session.name}_${term}`.replace(/\s+/g,"")
  };
  content.innerHTML = `<div id="report-target">${renderReportCardHTML(data,false)}</div>`;
  wireReportCardButtons(data);
}

    </table>
  `;
}

  <div class="report-wrap">
    <div class="no-print" style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" id="rc-print">🖨️ Print</button>

        <thead><tr><th>Subject</th><th>Test 1</th><th>Test 2</th><th>Test 3</th><th>Exam</th><th>B/F</th><th>Total</th><th>Cum. Score</th><th>Grade</th></tr></thead>

function wireReportCardButtons(d){
  try{
    const el = document.getElementById('rc-qr-pub') || document.getElementById('rc-qr-priv');
    if(el && window.QRCode && d.publicId){
      el.innerHTML = "";
      new QRCode(el, {text: `${location.origin}${location.pathname}#/verify?id=${encodeURIComponent(d.publicId)}`, width:96, height:96, colorDark:"#2E1650"});
    }
  }catch(e){ /* qr optional */ }
  const printBtn = $("#rc-print");
  const pdfBtn = $("#rc-pdf");
  if(printBtn) printBtn.onclick = ()=> window.print();
  if(pdfBtn) pdfBtn.onclick = ()=>{
    const card = $("#rc-card");
    html2pdf().set({margin:10, filename:`${d.studentName||'Report'}-${d.term||''}.pdf`, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(card).save();
  };
}

/* =========================================================================
   22b. BULK DOWNLOAD RESULTS (Admin / Principal) — all / by class / individual
   ========================================================================= */
async function renderDownloadResults(content){
  const [classes, session] = await Promise.all([fetchAll("classes","name"), getCurrentSession()]);
  if(!session){ content.innerHTML = `<div class="empty-state">No academic session configured yet.</div>`; return; }

  content.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>Download Results</h3></div>
    <p class="small-note">Download published report cards as a single combined PDF — for all students, for one class, or for one individual student. Only <b>published</b> results are included.</p>
    <div class="field-row">
      <div class="field"><label>Scope</label>
        <select id="dr-scope">
          <option value="all">All Students</option>
          <option value="class">One Class</option>
          <option value="individual">Individual Student</option>
        </select>
      </div>
      <div class="field"><label>Term</label>
        <select id="dr-term">${TERMS.map(t=>`<option value="${t.id}" ${t.id===state.currentTerm?'selected':''}>${t.label}</option>`).join("")}</select>
      </div>
    </div>
    <div class="field" id="dr-class-field" style="display:none;">
      <label>Class</label>
      <select id="dr-class"><option value="">Select a class…</option>${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
    </div>
    <div class="field" id="dr-student-field" style="display:none;">
      <label>Search Student (name or admission no)</label>
      <input id="dr-student-search" placeholder="Start typing…">
      <div id="dr-student-results" class="small-note" style="margin-top:6px;"></div>
      <input type="hidden" id="dr-student-id">
    </div>
    <button class="btn btn-primary" id="dr-download">⬇️ Generate &amp; Download PDF</button>
    <div id="dr-status" class="small-note" style="margin-top:10px;"></div>
  </div>
  <div id="dr-print-area" style="position:fixed;left:-9999px;top:0;"></div>`;

  $("#dr-scope").addEventListener("change", ()=>{
    const scope = $("#dr-scope").value;
    $("#dr-class-field").style.display = scope==="class" ? "block" : "none";
    $("#dr-student-field").style.display = scope==="individual" ? "block" : "none";
  });

  let allStudents = null;
  $("#dr-student-search").addEventListener("input", async ()=>{
    if(!allStudents) allStudents = await fetchAll("students");
    const q = $("#dr-student-search").value.trim().toLowerCase();
    const matches = q ? allStudents.filter(s=> s.status!=="archived" && ((s.fullName||"").toLowerCase().includes(q) || (s.admissionNo||"").toLowerCase().includes(q))).slice(0,8) : [];
    $("#dr-student-results").innerHTML = matches.map(s=>`<div data-pick="${s.id}" style="padding:6px 0;cursor:pointer;border-bottom:1px solid var(--border);">${esc(s.fullName)} — ${esc(s.admissionNo)}</div>`).join("") || (q ? "No matches." : "");
    $all("[data-pick]").forEach(el=> el.onclick = ()=>{
      $("#dr-student-id").value = el.dataset.pick;
      $("#dr-student-search").value = el.textContent;
      $("#dr-student-results").innerHTML = "";
    });
  });

  $("#dr-download").onclick = async ()=>{
    const scope = $("#dr-scope").value;
    const term = $("#dr-term").value;
    const status = $("#dr-status");
    const printArea = $("#dr-print-area");
    status.textContent = "Gathering published results…";

    let query = db.collection("publicResults").where("sessionId","==",session.id).where("term","==",term);
    if(scope==="class"){
      const classId = $("#dr-class").value;
      if(!classId){ toast("Please select a class.","error"); status.textContent=""; return; }
      query = query.where("className","==", $("#dr-class").selectedOptions[0].textContent);
    }
    if(scope==="individual"){
      const sid = $("#dr-student-id").value;
      if(!sid){ toast("Please search and select a student.","error"); status.textContent=""; return; }
    }

    let snap;
    try{ snap = await query.get(); } catch(e){ toast("Could not query published results: "+e.message, "error"); status.textContent=""; return; }
    let docs = snap.docs.map(d=>d.data());
    if(scope==="individual"){
      const sid = $("#dr-student-id").value;
      docs = docs.filter(d=> d.studentId === sid);
    }
    if(!docs.length){ toast("No published results found for this selection.","error"); status.textContent=""; return; }

    status.textContent = `Building PDF for ${docs.length} report card(s)…`;
    printArea.innerHTML = docs.map((d,i)=> `<div class="${i < docs.length-1 ? 'page-break':''}">${renderReportCardHTML({
      studentName:d.studentName, admissionNo:d.admissionNo, className:d.className, house:d.house||"", totalInClass:d.totalInClass,
      sessionName:d.sessionName, term:d.term, position:d.position, subjects:d.subjects||[],
      teacherRemark:d.teacherRemark, principalRemark:d.principalRemark, guidanceRemark:d.guidanceRemark,
      attendancePresent:d.attendancePresent, attendanceTotal:d.attendanceTotal,
      characterDevelopment:d.characterDevelopment||{}, practicalSkills:d.practicalSkills||{}, psychomotorSkills:d.psychomotorSkills||{},
      award:d.award, vacationDate:d.vacationDate, resumptionDate:d.resumptionDate, promotion:d.promotion, publicId:d.publicId
    }, true)}</div>`).join("");
    // strip the per-card print/PDF buttons from the combined output
    $all(".no-print", printArea).forEach(el=> el.remove());

    try{
      await html2pdf().set({margin:8, filename:`Results-${scope}-${term}.pdf`, image:{type:'jpeg',quality:0.95}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(printArea).save();
      status.textContent = "Download complete.";
      await logAudit("bulk_download_results", {scope, term, count: docs.length});
    }catch(e){
      toast("PDF generation failed: "+e.message, "error");
      status.textContent = "";
    }
  };
}

/* =========================================================================
   24. AUTH STATE BOOTSTRAP
   ========================================================================= */
auth.onAuthStateChanged(async user => {
    state.user = user;

    if (!user) {
        state.profile = null;
        render();
        return;
    }

    try {
        const doc = await db.collection("users").doc(user.uid).get();

        if (doc.exists) {
            state.profile = {
                id: doc.id,
                ...doc.data()
            };

            const sess = await getCurrentSession();

            if (sess) {
                state.currentTerm =
                    sess.currentTerm || "first";
            }

        } else {
            state.profile = {
                name: user.email,
                role: "parent",
                assignments: [],
                linkedStudentIds: []
            };

            toast(
                "Your account has no role assigned yet. Contact the school admin.",
                "error"
            );
        }

    } catch (e) {
        console.error(e);

        state.profile = {
            name: user.email,
            role: "parent",
            assignments: []
        };
    }

    render();
});


// initial paint while auth resolves
render();
