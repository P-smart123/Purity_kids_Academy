<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Purity Kids Academy — Result Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK — no build step required) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- QR code generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --purple-900:#2E1650;
  --purple-800:#3E1F6E;
  --purple-700:#5B2A86;
  --purple-600:#6E36A3;
  --purple-500:#8546C4;
  --purple-100:#F1E9FB;
  --purple-50:#F8F5FC;
  --white:#FFFFFF;
  --ink:#241B33;
  --ink-soft:#5B5468;
  --border:#E4DCEF;
  --success:#1B8A5A;
  --success-bg:#E7F7EF;
  --warn:#B9720B;
  --warn-bg:#FDF3E1;
  --danger:#C23434;
  --danger-bg:#FCEAEA;
  --radius:12px;
  --shadow: 0 4px 18px rgba(46,22,80,0.08);
  --font-display:'Poppins',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--purple-50);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.display{font-family:var(--font-display);color:var(--purple-900);margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
img{max-width:100%;display:block;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
::selection{background:var(--purple-500);color:#fff;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:none;font-weight:600;font-size:14.5px;transition:transform .12s ease, box-shadow .12s ease, background .15s ease, color .15s ease;white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--purple-700);color:#fff;box-shadow:0 6px 16px rgba(91,42,134,0.28);}
.btn-primary:hover{background:var(--purple-800);}

/* Default outline button: readable on WHITE / light backgrounds (tables, panels, modals) */
.btn-outline{
    background: transparent;
    color: var(--purple-700);
    border: 2px solid var(--purple-700);
}
.btn-outline:hover{
    background: var(--purple-700);
    color: #ffffff;
}

/* Use this modifier for outline buttons placed on a dark/purple background
   (hero banner, sidebar, gradient panels) so they stay white-on-transparent */
.btn-outline-light{
    background: transparent;
    color: #ffffff;
    border: 2px solid rgba(255,255,255,.75);
}
.btn-outline-light:hover{
    background: #ffffff;
    color: var(--purple-800);
}

.btn-ghost{background:transparent;color:var(--purple-700);}
.btn-ghost:hover{background:var(--purple-100);}

.btn-white{
    background: #ffffff;
    color: var(--purple-800);
    border: 2px solid #ffffff;
}
.btn-white:hover{
    background: transparent;
    color: #ffffff;
}

.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* ---------- Top nav (public) ---------- */
.pub-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.pub-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;color:var(--purple-800);font-size:17px;}
.brand .logo-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--purple-600),var(--purple-900));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:17px;}
.pub-links{display:flex;gap:26px;align-items:center;}
.pub-links a{font-size:14.5px;font-weight:600;color:var(--ink-soft);}
.pub-links a:hover{color:var(--purple-700);}
.menu-toggle{display:none;background:none;border:none;font-size:22px;color:var(--purple-800);}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(160deg,var(--purple-900) 0%,var(--purple-700) 55%,var(--purple-500) 100%);color:#fff;padding:90px 0 110px;position:relative;overflow:hidden;}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);}
.hero-inner{position:relative;z-index:2;text-align:center;max-width:720px;margin:0 auto;}
.eyebrow{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12.5px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;margin-bottom:22px;}
.hero h1{
    color: #ffffff;
    font-weight: 900;
    font-size: clamp(42px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: -1px;
    text-align: center;
    text-transform: uppercase;
    text-shadow:
        0 2px 4px rgba(0,0,0,0.20),
        0 6px 18px rgba(0,0,0,0.18);
}
.hero .motto{
    color: #f3efff;
    font-weight: 500;
    font-size: 24px;
}
.hero p.lead{color: #ffffff;
    font-weight: 500;}
.hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* ---------- Sections ---------- */
.section{padding:70px 0;}
.section-head{text-align:center;max-width:640px;margin:0 auto 46px;}
.section-head .tag{color:var(--purple-600);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.section-head h2{font-size:30px;margin-top:8px;}
.section-head p{color:var(--ink-soft);margin-top:10px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);}
.acad-card{text-align:center;transition:transform .15s;}
.acad-card:hover{transform:translateY(-4px);}
.acad-card .icon{width:56px;height:56px;border-radius:14px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:800;font-family:var(--font-display);}
.acad-card h3{font-size:17px;margin-bottom:6px;}
.acad-card p{font-size:13.5px;color:var(--ink-soft);}
.anthem-box{white-space:pre-line;font-size:14.5px;line-height:1.9;color:var(--ink-soft);}
.section-alt{background:var(--purple-50);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.contact-item{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;}
.contact-item .ic{width:38px;height:38px;border-radius:9px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
footer{background:var(--purple-900);color:rgba(255,255,255,.8);padding:46px 0 22px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;margin-bottom:30px;}
footer h4{color:#fff;font-size:14px;margin-bottom:14px;}
footer a{display:block;font-size:13.5px;color:rgba(255,255,255,.7);margin-bottom:9px;}
footer a:hover{color:#fff;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:18px;font-size:12.5px;text-align:center;color:rgba(255,255,255,.55);}

/* ---------- Forms ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
input,select,textarea{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--border);font-family:var(--font-body);font-size:14.5px;color:var(--ink);background:#fff;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple-500);}
.field{margin-bottom:16px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--purple-900),var(--purple-600));padding:20px;}
.auth-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.auth-card .brand{justify-content:center;margin-bottom:6px;}
.auth-card h2{text-align:center;font-size:20px;margin-bottom:4px;}
.auth-card p.sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;}
.err-msg{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}
.ok-msg{background:var(--success-bg);color:var(--success);padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}

/* ---------- App shell (logged in) ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--purple-900);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .2s;}
.sidebar .brand{padding:22px 20px 18px;color:#fff;font-size:15.5px;}
.sidebar .brand .logo-badge{background:linear-gradient(145deg,#fff,var(--purple-100));color:var(--purple-800);}
.side-role{padding:0 20px 14px;font-size:12px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;}
.side-links{flex:1;padding:6px 12px;}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.78);font-size:14px;font-weight:500;margin-bottom:3px;}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff;}
.side-link.active{background:var(--purple-600);color:#fff;}
.side-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);}
.side-user{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:10px;}
.main{flex:1;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.topbar h1{font-size:19px;}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--purple-800);}
.content{padding:26px 28px 60px;}

/* ---------- Dashboard stat cards ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-card .val{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--purple-800);margin-top:6px;}
.stat-card.accent{background:linear-gradient(135deg,var(--purple-700),var(--purple-900));color:#fff;}
.stat-card.accent .lbl{color:rgba(255,255,255,.75);}
.stat-card.accent .val{color:#fff;}

/* ---------- Panels / tables ---------- */
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-size:16.5px;}
table{width:100%;border-collapse:collapse;font-size:13.8px;}
th{text-align:left;padding:10px 12px;color:var(--ink-soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--border);}
td{padding:11px 12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.badge-draft{background:#EEE;color:#555;}
.badge-submitted{background:var(--warn-bg);color:var(--warn);}
.badge-approved{background:#E4F0FE;color:#1B5AA8;}
.badge-published{background:var(--success-bg);color:var(--success);}
.badge-rejected{background:var(--danger-bg);color:var(--danger);}
.icon-btn{background:none;border:none;color:var(--purple-700);font-size:16px;padding:4px 6px;border-radius:6px;}
.icon-btn:hover{background:var(--purple-100);}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .big{font-size:38px;margin-bottom:10px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(46,22,80,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:26px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-box h3{margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--purple-900);color:#fff;padding:13px 18px;border-radius:10px;font-size:13.8px;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:320px;animation:slidein .2s ease;}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
@keyframes slidein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Result entry grid ---------- */
.score-input{width:64px;padding:7px;text-align:center;}
.small-note{font-size:12px;color:var(--ink-soft);}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.pill-tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.pill-tab.active{background:var(--purple-700);border-color:var(--purple-700);color:#fff;}

/* ---------- Report card ---------- */
.report-wrap{max-width:820px;margin:24px auto;background:#fff;}
.report-card{border:3px solid var(--purple-700);border-radius:10px;padding:30px;}
.rc-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--purple-700);padding-bottom:16px;margin-bottom:16px;}
.rc-logo{width:64px;height:64px;border-radius:12px;background:var(--purple-700);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:26px;}
.rc-head h2{font-size:20px;color:var(--purple-800);}
.rc-head p{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.rc-title{text-align:center;font-weight:700;color:var(--purple-700);letter-spacing:.05em;text-transform:uppercase;margin:14px 0;font-size:13px;}
.rc-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 20px;font-size:13px;margin-bottom:18px;}
.rc-info-grid div b{color:var(--ink-soft);font-weight:600;}
.rc-table th,.rc-table td{border:1px solid var(--border);padding:7px 8px;font-size:12.5px;}
.rc-remarks{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.rc-remark-box{border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;}
.rc-remark-box b{display:block;color:var(--purple-700);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.rc-sign-row{display:flex;justify-content:space-between;margin-top:30px;font-size:12px;}
.rc-sign-row div{text-align:center;width:150px;border-top:1px solid var(--ink);padding-top:6px;}
.rc-qr{display:flex;justify-content:center;margin-top:16px;}
.rc-section-title{font-weight:700;color:var(--purple-700);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.rc-skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
.rc-skills-table td{padding:5px 8px;}
.rc-skills-table td.rc-skill-name{color:var(--ink-soft);}
.rc-skills-table td.rc-skill-grade{text-align:center;font-weight:700;color:var(--purple-700);width:40px;}
.rc-meta-row{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12.5px;color:var(--ink-soft);margin-top:10px;}
.rc-meta-row b{color:var(--ink);}
.rc-promo-box{margin-top:14px;border:2px dashed var(--purple-500);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--purple-800);text-align:center;}
.page-break{page-break-after:always;}
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .report-wrap{margin:0;max-width:100%;}
}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .contact-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .rc-info-grid{grid-template-columns:1fr 1fr;}
  .rc-skills-grid{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .pub-links{position:fixed;top:64px;left:0;right:0;background:#fff;flex-direction:column;padding:16px 24px;border-bottom:1px solid var(--border);display:none;}
  .pub-links.open{display:flex;}
  .menu-toggle{display:block;}
  .hero h1{font-size:32px;}
  .sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:18px 14px 50px;}
  .grid-2{grid-template-columns:1fr;}
}
/* ============================================================
   GLOBAL VISIBILITY + ACCESSIBILITY IMPROVEMENTS
   Makes text, buttons, inputs and actions fully readable
   ============================================================ */

/* ---------- Global text visibility ---------- */

button,
input,
select,
textarea,
label,
a,
span,
td,
th {
  visibility: visible !important;
}

/* Prevent important text from becoming transparent */
button,
input,
select,
textarea,
.btn,
.action-btn,
.icon-btn,
.side-link,
.topbar a,
.panel a {
  opacity: 1 !important;
}


/* ---------- Inputs, selects and textareas ---------- */

input,
select,
textarea {
  width: 100%;
  max-width: 100%;
  color: var(--ink) !important;
  background-color: #ffffff !important;
  border: 1.5px solid var(--border) !important;
  opacity: 1 !important;
  visibility: visible !important;

  /* Allow text to remain visible */
  text-overflow: clip;
  overflow: visible;
}

input:focus,
select:focus,
textarea:focus {
  color: var(--ink) !important;
  background-color: #ffffff !important;
  border-color: var(--purple-500) !important;
  outline: none;
}

/* Placeholder text */
input::placeholder,
textarea::placeholder {
  color: #5b5468 !important;
  opacity: 1 !important;
}

/* Disabled fields should still be readable */
input:disabled,
select:disabled,
textarea:disabled {
  color: var(--ink) !important;
  background-color: #f5f2f8 !important;
  opacity: 0.85 !important;
  cursor: not-allowed;
}

/* Make selected dropdown text readable */
select,
select option {
  color: var(--ink) !important;
  background-color: #ffffff !important;
  opacity: 1 !important;
}

/* Make long textarea content visible */
textarea {
  min-height: 90px;
  resize: vertical;
  overflow-wrap: anywhere;
}


/* ============================================================
   BUTTON VISIBILITY
   ============================================================ */

button,
.btn,
.action-btn,
.icon-btn {
  visibility: visible !important;
  opacity: 1 !important;
  max-width: 100%;
}

/* Normal buttons can wrap text instead of hiding it */
.btn,
.action-btn {
  min-height: 38px;
  height: auto;
  white-space: normal !important;
  overflow: visible !important;
  text-overflow: clip !important;
  overflow-wrap: anywhere;
  word-break: normal;
}

/* Keep buttons properly centered */
.btn,
.action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

/* Disabled buttons remain readable */
button:disabled,
.btn:disabled,
.action-btn:disabled {
  opacity: 0.7 !important;
  color: inherit !important;
}

/* Icon buttons should not hide text if text exists */
.icon-btn {
  width: auto;
  min-width: 32px;
  min-height: 32px;
  height: auto;
  white-space: normal !important;
  overflow: visible !important;
}


/* ============================================================
   TABLE VISIBILITY
   ============================================================ */

.table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
}

/* Allow table to use the space it needs */
table {
  width: 100%;
  min-width: 700px;
}

/* Make headings readable */

function computeGradeFromScore(score, gradingScale){
  if(!gradingScale || !gradingScale.length) return {grade:"-", remark:"-"};
  const found = gradingScale.find(g => score >= g.min && score <= g.max);
  return found ? {grade:found.grade, remark:found.remark} : {grade:"-", remark:"-"};
}

    const term = $("#rc-term").value;

    try{
      const docId = `${adm}_${pin}_${session}_${term}`.replace(/\s+/g,"");

      if(!snap.exists){
        msg.innerHTML = `<div class="err-msg">No published result found for these details. Check your Admission Number, PIN, Session and Term, or contact the school office.</div>`;

  const box = $("#verify-box");
  if(!vId){ box.innerHTML = `<div class="err-msg">No verification code supplied.</div>`; return; }
  try{
    const snap = await db.collection("publicResults").doc(vId).get();
    if(!snap.exists){ box.innerHTML = `<div class="err-msg">This result could not be verified. It may not exist or has not been published.</div>`; return; }
    const d = snap.data();
    box.innerHTML = `

        <div><b>Verification No:</b> ${esc(vId)}</div>
      </div>`;
  }catch(e){ box.innerHTML = `<div class="err-msg">${esc(e.message)}</div>`; }
}

/* ---- shared data fetchers ---- */
async function fetchAll(col, orderField){
  let q = db.collection(col);
  const snap = await q.get();
  let arr = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(orderField) arr.sort((a,b)=> (a[orderField]||"").localeCompare(b[orderField]||""));
  return arr;
}
async function getGradingScale(){
  const arr = await fetchAll("gradingScale");
  arr.sort((a,b)=> b.min - a.min);
  return arr;
}
async function getCurrentSession(){
  const arr = await fetchAll("sessions");
  return arr.find(s=>s.isCurrent) || arr[0] || null;
}

async function renderSessions(content){
  const sessionsRaw = await fetchAll("sessions");

  // De-duplicate by name (case-insensitive, trimmed) so a session never
  // displays more than once even if duplicate docs exist in Firestore.
  // Prefer the current one, then the most recently created, and fold
  // every other duplicate id into it so "Delete" can clear them all.
  const groups = {};
  sessionsRaw.forEach(s=>{
    const key = (s.name||"").trim().toLowerCase();
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  const sessions = Object.values(groups).map(group=>{
    group.sort((a,b)=>{
      if(!!a.isCurrent !== !!b.isCurrent) return a.isCurrent ? -1 : 1;
      const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return bt - at;
    });
    const primary = group[0];
    return {...primary, duplicateIds: group.slice(1).map(g=>g.id)};
  }).sort((a,b)=>(a.name||"").localeCompare(b.name||""));

  content.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>Academic Sessions</h3><button class="btn btn-primary btn-sm" id="add-session">+ Add Session</button></div>
    <p class="small-note" style="margin-bottom:12px;">Each session name is only shown once, even if duplicates exist behind the scenes. Use the 🗑️ button to permanently delete a session you no longer want (including any duplicate copies of it).</p>
    <div class="table-wrap"><table><thead><tr><th>Session</th><th>Current Term</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${sessions.length ? sessions.map(s=>`
      <tr>
        <td><b>${esc(s.name)}</b>${s.duplicateIds.length ? ` <span class="badge badge-rejected" title="Duplicate entries found and merged in this view">${s.duplicateIds.length} duplicate${s.duplicateIds.length>1?'s':''} found</span>` : ''}</td>
        <td>${termLabel(s.currentTerm||'first')}</td>
        <td>${s.isCurrent? '<span class="badge badge-published">Current</span>' : '<span class="badge badge-draft">Archived</span>'}</td>
        <td>
          ${!s.isCurrent? `<button class="btn btn-outline btn-sm" data-set-current="${s.id}">Set as Current</button>`:''}
          <button class="btn icon-btn" data-del-session="${s.id}" data-dupe-ids="${esc(s.duplicateIds.join(','))}" title="Delete this session">🗑️</button>
        </td>
      </tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);">No sessions yet. Add each new academic year here.</td></tr>`}
    </tbody></table></div>
  </div>`;
  $("#add-session").onclick = ()=>{
    openModal("Add Academic Session", `
      <div id="ns-msg"></div>
      <div class="field"><label>Session (e.g. 2025/2026)</label><input id="ns-name" placeholder="2025/2026"></div>
      <div class="field"><label>Current Term</label><select id="ns-term">${TERMS.map(t=>`<option value="${t.id}">${t.label}</option>`).join("")}</select></div>
      <div class="modal-actions"><button class="btn btn-outline" id="ns-cancel">Cancel</button><button class="btn btn-primary" id="ns-save">Save</button></div>`,
      body=>{
        $("#ns-cancel", body).onclick = closeModal;
        $("#ns-save", body).onclick = async ()=>{
          const name = $("#ns-name", body).value.trim();
          const msg = $("#ns-msg", body);
          if(!name){ toast("Session name required","error"); return; }
          // Prevent creating a duplicate — check (case-insensitive) against
          // every existing session, not just the de-duplicated view.
          const allSessions = await fetchAll("sessions");
          const clash = allSessions.find(s => (s.name||"").trim().toLowerCase() === name.toLowerCase());
          if(clash){
            msg.innerHTML = `<div class="err-msg">A session named "${esc(clash.name)}" already exists. Use "Set as Current" on it instead of creating a duplicate, or delete it first from the list.</div>`;
            return;
          }
          const batch = db.batch();
          const existing = await db.collection("sessions").where("isCurrent","==",true).get();
          existing.forEach(d=> batch.update(d.ref, {isCurrent:false}));
          const ref = db.collection("sessions").doc();
          batch.set(ref, {name, currentTerm: $("#ns-term",body).value, isCurrent:true, createdAt: nowStamp()});
          await batch.commit();
          await logAudit("create_session", {name});
          closeModal(); toast("Session added", "success"); renderApp($("#app"), location.hash);
        };
      });
  };
  $all("[data-set-current]").forEach(btn=> btn.onclick = async ()=>{
    const id = btn.dataset.setCurrent;
    const batch = db.batch();
    const existing = await db.collection("sessions").where("isCurrent","==",true).get();
    existing.forEach(d=> batch.update(d.ref, {isCurrent:false}));
    batch.update(db.collection("sessions").doc(id), {isCurrent:true});
    await batch.commit();
    toast("Current session updated", "success");
    renderApp($("#app"), location.hash);
  });
  $all("[data-del-session]").forEach(btn=> btn.onclick = async ()=>{
    const id = btn.dataset.delSession;
    const dupeIds = (btn.dataset.dupeIds||"").split(",").filter(Boolean);
    const confirmed = await confirmDialog(
      dupeIds.length
        ? `Delete this session and its ${dupeIds.length} duplicate ${dupeIds.length>1?'copies':'copy'}? This cannot be undone.`
        : `Delete this session? This cannot be undone. If it was the current session, remember to set a new current session afterward.`,
      "Delete"
    );
    if(!confirmed) return;
    const batch = db.batch();
    batch.delete(db.collection("sessions").doc(id));
    dupeIds.forEach(did=> batch.delete(db.collection("sessions").doc(did)));
    await batch.commit();
    await logAudit("delete_session", {id, duplicatesRemoved: dupeIds.length});
    toast("Session deleted", "success");
    renderApp($("#app"), location.hash);
  });
}

  openModal(isEdit? "Edit Student" : "Add Student", `
    ${lockClassId ? `<p class="small-note" style="margin-bottom:12px;">As Class Teacher, you can only register or edit students within your own class.</p>` : ``}
    <div class="field-row">
      <div class="field"><label>Full Name</label><input id="sm-name" value="${esc(student?.fullName||'')}"></div>
      <div class="field"><label>Gender</label><select id="sm-gender"><option ${student?.gender==='Male'?'selected':''}>Male</option><option ${student?.gender==='Female'?'selected':''}>Female</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Class${lockClassId? ' (locked to your class)':''}</label><select id="sm-class" ${lockClassId?'disabled':''}>${classOptions.map(c=>`<option value="${c.id}" data-section="${c.section}" ${(student?.classId===c.id || lockClassId===c.id)?'selected':''}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Date of Birth</label><input type="date" id="sm-dob" value="${student?.dob||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Admission No ${isEdit?'':'(auto-generated if left blank)'}</label><input id="sm-adm" value="${esc(student?.admissionNo||'')}"></div>
      <div class="field"><label>Status</label><select id="sm-status"><option value="active" ${student?.status==='active'?'selected':''}>Active</option><option value="archived" ${student?.status==='archived'?'selected':''}>Archived</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>House (optional)</label><input id="sm-house" value="${esc(student?.house||'')}" placeholder="e.g. Red House"></div>
      <div class="field"><label>Parent/Guardian Phone</label><input id="sm-guardphone" value="${esc(student?.guardianPhone||'')}"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" id="sm-cancel">Cancel</button><button class="btn btn-primary" id="sm-save">${isEdit?'Save Changes':'Add Student'}</button></div>`,
    body=>{
      $("#sm-cancel",body).onclick = closeModal;
      $("#sm-save",body).onclick = async ()=>{
        const name = $("#sm-name",body).value.trim();
        if(!name){ toast("Student name is required","error"); return; }
        const classSel = $("#sm-class",body);
        const classId = classSel.value;
        const className = classSel.selectedOptions[0]?.textContent || "";
        const section = classSel.selectedOptions[0]?.dataset.section || "PRIMARY";
        const payload = {
          fullName: name,
          gender: $("#sm-gender",body).value,
          classId, className, section,
          dob: $("#sm-dob",body).value,
          status: $("#sm-status",body).value,
          house: $("#sm-house",body).value.trim(),
          guardianPhone: $("#sm-guardphone",body).value.trim(),
          updatedAt: nowStamp()
        };
        try{
          if(isEdit){
            await db.collection("students").doc(student.id).update(payload);

            toast("Student updated","success");
          } else {
            payload.admissionNo = $("#sm-adm",body).value.trim() || genAdmissionNo(section);
            payload.pin = genPin();
            payload.createdAt = nowStamp();
            const ref = await db.collection("students").add(payload);
            await logAudit("add_student", {id: ref.id, name});
            toast(`Student added. PIN: ${payload.pin}`, "success");
          }
          closeModal();
          renderApp($("#app"), location.hash);
        }catch(err){ toast(err.message, "error"); }
      };
    });
}

/* Subject Teacher view — read-only, strictly scoped to the classes and
   subjects they were assigned in Staff & Users. Grouped by class, and
   each group shows exactly which subject(s) this teacher teaches there,
   so the data stays clearly organized rather than one flat list. */
async function renderMyStudents(content){
  const assignments = state.profile.assignments || [];
  const classIds = [...new Set(assignments.map(a=>a.classId))];
  if(!classIds.length){ content.innerHTML = `<div class="empty-state">No classes assigned to you yet — ask the administrator to assign you a class and subject.</div>`; return; }

  const students = await fetchAll("students");
  const mine = students.filter(s=> classIds.includes(s.classId) && s.status!=="archived");

  // Group assignments by class so each class panel can show which
  // subject(s) this teacher is responsible for there.
  const subjectsByClass = {};
  assignments.forEach(a=>{
    if(!subjectsByClass[a.classId]) subjectsByClass[a.classId] = new Set();
    subjectsByClass[a.classId].add(a.subjectName);
  });

  const classGroups = classIds.map(cid=>{
    const className = (assignments.find(a=>a.classId===cid)||{}).className || "Class";
    const classStudents = mine.filter(s=>s.classId===cid).sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||""));
    const subjectNames = [...(subjectsByClass[cid]||[])];
    return {cid, className, subjectNames, classStudents};
  }).sort((a,b)=> a.className.localeCompare(b.className));

  content.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>My Students (${mine.length})</h3></div>
    <p class="small-note">You can only see the classes and subjects you've been assigned — this list is read-only. To register a new student, ask the Class Teacher or Admin.</p>
  </div>
  ${classGroups.map(g=>`
    <div class="panel">
      <div class="panel-head">
        <h3>${esc(g.className)} <span class="badge badge-approved" style="margin-left:8px;">${esc(g.subjectNames.join(", "))}</span></h3>
        <span class="small-note">${g.classStudents.length} student${g.classStudents.length===1?'':'s'}</span>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Admission No</th><th>House</th></tr></thead><tbody>
      ${g.classStudents.length ? g.classStudents.map(s=>`<tr><td>${esc(s.fullName)}</td><td>${esc(s.admissionNo)}</td><td>${esc(s.house||'—')}</td></tr>`).join("") : `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);">No students in this class yet.</td></tr>`}
      </tbody></table></div>
    </div>
  `).join("")}`;
}

      <p class="small-note" style="margin-bottom:10px;">A teacher can hold <b>both</b> roles at once: they can be the <b>Class Teacher</b> of one class (full access to that class's students, attendance and character reports) <i>and</i> a <b>Subject Teacher</b> for one or more subject + class combinations (can only record results for their own assigned subjects).</p>

      <div class="rc-section-title" style="margin-top:0;">Subject Teacher Assignment(s):</div>
      <div class="field-row">
        <div class="field"><label>Subject</label><select id="at-subject">${subjects.map(s=>`<option value="${s.id}" data-name="${esc(s.name)}">${esc(s.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Class</label><select id="at-class">${classes.map(c=>`<option value="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select></div>
      </div>
      <button class="btn btn-outline btn-sm" id="at-add" type="button">+ Add to list</button>
      <div style="margin-top:12px;" id="at-list">
        ${(u.assignments||[]).map((a,i)=>`<div data-idx="${i}" style="font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border);">${esc(a.subjectName)} — ${esc(a.className)}</div>`).join("")}
      </div>

      <div class="rc-section-title">Class Teacher Assignment:</div>
      <div class="field"><label><input type="checkbox" style="width:auto;" id="at-classteacher" ${u.classTeacherOf?'checked':''}> Make this person the Class Teacher of:</label>
        <select id="at-classteacher-select">${classes.map(c=>`<option value="${c.id}" data-name="${esc(c.name)}" ${u.classTeacherOf===c.id?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
      </div>
      <p class="small-note">Class Teacher = full access to every subject's results, attendance, and character/practical-skill reports for that one class only. Subject Teacher = can only enter/edit results for the subject(s) + class(es) listed above.</p>
      <div class="modal-actions"><button class="btn btn-outline" id="at-cancel">Cancel</button><button class="btn btn-primary" id="at-save">Save Assignments</button></div>`,
      body=>{
        let assignments = [...(u.assignments||[])];
        function redraw(){ $("#at-list",body).innerHTML = assignments.map((a,i)=>`<div style="font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">${esc(a.subjectName)} — ${esc(a.className)} <button type="button" data-rm="${i}" class="btn icon-btn">✕</button></div>`).join("");
          $all("[data-rm]",body).forEach(x=> x.onclick = ()=>{ assignments.splice(parseInt(x.dataset.rm),1); redraw(); }); }
        redraw();
        $("#at-add",body).onclick = ()=>{
          const subjSel = $("#at-subject",body), classSel = $("#at-class",body);
          assignments.push({subjectId:subjSel.value, subjectName:subjSel.selectedOptions[0].dataset.name, classId:classSel.value, className:classSel.selectedOptions[0].dataset.name});
          redraw();
        };
        $("#at-cancel",body).onclick = closeModal;
        $("#at-save",body).onclick = async ()=>{
          const ctChecked = $("#at-classteacher",body).checked;
          const ctSel = $("#at-classteacher-select",body);
          const payload = {assignments};
          payload.classTeacherOf = ctChecked ? ctSel.value : firebase.firestore.FieldValue.delete();
          payload.classTeacherOfName = ctChecked ? ctSel.selectedOptions[0].dataset.name : firebase.firestore.FieldValue.delete();
          await db.collection("users").doc(u.id).update(payload);
          closeModal(); toast("Assignments saved","success"); renderApp($("#app"), location.hash);
        };
      });
  });
}

/* =========================================================================
   19. ENTER RESULTS
   ========================================================================= */

async function renderEnterResults(content) {

  try {

    /* ---------------------------------------------------------
       LOAD DATA
    --------------------------------------------------------- */

    const [
      classes,
      subjects,
      students,
      session
    ] = await Promise.all([
      fetchAll("classes"),
      fetchAll("subjects"),
      fetchAll("students"),
      getCurrentSession()
    ]);

    if (!session) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="big">📅</div>
          No active academic session has been set up yet.
        </div>
      `;
      return;
    }

    const term = state.currentTerm || "first";


    /* ---------------------------------------------------------
       BUILD CLASS + SUBJECT COMBINATIONS
    --------------------------------------------------------- */

    let combinations = [];

    const userRole =
      state.profile &&
      state.profile.role
        ? String(state.profile.role).toLowerCase()
        : "";

    const isAdmin =
      userRole === "admin" ||
      userRole === "super_admin" ||
      userRole === "principal" ||
      userRole === "headteacher";


    /*
      ADMIN / PRINCIPAL:
      Show only Class + Subject combinations that are actually assigned
      via the Subjects page (subject.classIds). If a subject has no
      assignments recorded yet, it still shows for every class as a
      safe fallback so nothing is hidden by an empty configuration.

      TEACHER:
      Only show assignments given to that teacher.
    */

    if (
      !isAdmin &&
      state.profile &&
      Array.isArray(state.profile.assignments) &&
      state.profile.assignments.length
    ) {

      combinations = state.profile.assignments
        .map(a => {

          const classItem = classes.find(
            c => String(c.id) === String(a.classId)
          );

          const subjectItem = subjects.find(
            s => String(s.id) === String(a.subjectId)
          );

          return {
            classId: a.classId,
            className:
              a.className ||
              (classItem
                ? (
                    classItem.name ||
                    classItem.className ||
                    classItem.title
                  )
                : "Unnamed Class"),

            subjectId: a.subjectId,
            subjectName:
              a.subjectName ||
              (subjectItem
                ? (
                    subjectItem.name ||
                    subjectItem.subjectName ||
                    subjectItem.title
                  )
                : "Unnamed Subject")
          };

        })

        .filter(item =>
          item.classId &&
          item.subjectId
        );

    } else {

      /*
        ADMIN / PRINCIPAL
        Build combinations from each subject's assigned classes
        (subject.classIds), rather than every class × every subject.
      */

      subjects.forEach(s => {

        if (s.active === false) return;

        const assignedClassIds =
          Array.isArray(s.classIds) ? s.classIds : [];

        const targetClasses = assignedClassIds.length
          ? classes.filter(c =>
              assignedClassIds.some(id => String(id) === String(c.id))
            )
          : classes; // fallback: subject has no assignments yet

        targetClasses.forEach(c => {

          if (c.active === false) return;

          combinations.push({

            classId: c.id,

            className:
              c.name ||
              c.className ||
              c.title ||
              "Unnamed Class",

            subjectId: s.id,

            subjectName:
              s.name ||
              s.subjectName ||
              s.title ||
              "Unnamed Subject"

          });

        });

      });

    }


    /* ---------------------------------------------------------
       REMOVE DUPLICATES
    --------------------------------------------------------- */

    const seen = new Set();

    combinations = combinations.filter(item => {

      const key =
        `${item.classId}|${item.subjectId}`;

      if (seen.has(key)) {
        return false;
      }

      seen.add(key);

      return true;

    });


    /* ---------------------------------------------------------
       NO CLASS / SUBJECT
    --------------------------------------------------------- */

    if (!combinations.length) {

      content.innerHTML = `
        <div class="empty-state">

          <div class="big">✏️</div>

          No Class + Subject combinations are available.

        </div>
      `;

      return;

    }


    /* ---------------------------------------------------------
       RENDER PAGE
    --------------------------------------------------------- */

    content.innerHTML = `

      <div class="panel">

        <div class="panel-head">

          <h3>Enter Results</h3>

        </div>


        <div class="field-row">


          <div class="field">

            <label>Class + Subject</label>

            <select id="er-assign">

              <option value="">
                — Select Class + Subject —
              </option>

              ${combinations.map(item => `

                <option
                  value="${esc(item.classId)}|${esc(item.subjectId)}"
                >

                  ${esc(item.className)}
                  —
                  ${esc(item.subjectName)}

                </option>

              `).join("")}

            </select>

          </div>


          <div class="field">

            <label>Term</label>

            <select id="er-term">

              ${TERMS.map(t => `

                <option
                  value="${esc(t.id)}"
                  ${t.id === term ? "selected" : ""}
                >

                  ${esc(t.label)}

                </option>

              `).join("")}

            </select>

          </div>


        </div>


        <p class="small-note">

          Session:

          <b>${esc(session.name)}</b>

          · Max per test: 20 (×3 = 60)

          · Exam: 40

          · Total: 100

          — grade &amp; total are calculated automatically. The

          <b>B/F</b> column is the score brought forward from the

          previous term (used to compute the cumulative score on the

          report card) — leave it at 0 for First Term.

        </p>

      </div>


      <div id="er-table-wrap">

        <div class="empty-state">

          <div class="big">✏️</div>

          Select a Class + Subject to enter results.

        </div>

      </div>

    `;


    /* ---------------------------------------------------------
       GET PAGE ELEMENTS
    --------------------------------------------------------- */

    const assignmentSelect =
      $("#er-assign");

    const termSelect =
      $("#er-term");

    const tableWrap =
      $("#er-table-wrap");


    if (
      !assignmentSelect ||
      !termSelect ||
      !tableWrap
    ) {

      console.error(
        "Enter Results elements could not be found."
      );

      return;

    }


    /* ---------------------------------------------------------
       LOAD RESULT TABLE
    --------------------------------------------------------- */

    async function loadTable() {

      try {

        const value =
          assignmentSelect.value;

        const selectedTerm =
          termSelect.value;


        /*
          NO SELECTION
        */

        if (
          !value ||
          !value.includes("|")
        ) {

          tableWrap.innerHTML = `

            <div class="empty-state">

              <div class="big">✏️</div>

              Select a Class + Subject to enter results.

            </div>

          `;

          return;

        }


        /*
          SPLIT CLASS AND SUBJECT
        */

        const [
          classId,
          subjectId
        ] = value.split("|");


        /*
          FIND SELECTED COMBINATION
        */

        const assignment =
          combinations.find(item =>
            String(item.classId) === String(classId) &&
            String(item.subjectId) === String(subjectId)
          );


        if (!assignment) {

          tableWrap.innerHTML = `

            <div class="empty-state">

              <div class="big">⚠️</div>

              Class or Subject could not be found.

            </div>

          `;

          return;

        }


        /*
          SHOW LOADING
        */

        tableWrap.innerHTML = `

          <div class="empty-state">

            <div class="big">⏳</div>

            Loading students...

          </div>

        `;


        /*
          GET GRADING SCALE
        */

        const gradingScale =
          await getGradingScale();


        /*
          FIND STUDENTS

          This checks both classId and className.

          This prevents the previous problem where
          the student exists but classId does not
          exactly match the assignment.
        */

        const selectedClass =
          classes.find(c =>
            String(c.id) === String(classId)
          );


        const selectedClassName =
          assignment.className ||
          (
            selectedClass
              ? (
                  selectedClass.name ||
                  selectedClass.className ||
                  selectedClass.title
                )
              : ""
          );


        const classStudents =
          students.filter(student => {

            if (
              student.status === "archived"
            ) {
              return false;
            }


            const studentClassId =
              String(
                student.classId ||
                student.class ||
                ""
              ).trim();


            const studentClassName =
              String(
                student.className ||
                ""
              ).trim();


            return (

              studentClassId ===
                String(classId).trim()

              ||

              studentClassName.toLowerCase() ===
                String(selectedClassName)
                  .trim()
                  .toLowerCase()

            );

          });


        /*
          NO STUDENTS
        */

        if (!classStudents.length) {

          tableWrap.innerHTML = `

            <div class="empty-state">

              <div class="big">👩‍🎓</div>

              No students have been assigned to

              <b>
                ${esc(selectedClassName)}
              </b>

              yet.

            </div>

          `;

          return;

        }


        /*
          LOAD EXISTING RESULTS
        */

        const resultDocs =
          await Promise.all(

            classStudents.map(student =>

              db.collection("results")
                .doc(
                  `${student.id}_${subjectId}_${session.id}_${selectedTerm}`
                )
                .get()

            )

          );


        /*
          RENDER RESULT TABLE
        */

        tableWrap.innerHTML = `

          <div class="panel">


            <div class="panel-head">

              <h3>

                ${esc(assignment.className)}

                —

                ${esc(assignment.subjectName)}

              </h3>


              <div>

                <button
                  class="btn btn-outline btn-sm"
                  id="er-save-draft"
                >

                  Save Draft

                </button>


                <button
                  class="btn btn-primary btn-sm"
                  id="er-submit"
                >

                  Submit Results

                </button>

              </div>


            </div>


            <div class="table-wrap">


              <table id="er-table">


                <thead>

                  <tr>

                    <th>Student</th>

                    <th>Test 1 (20)</th>

                    <th>Test 2 (20)</th>

                    <th>Test 3 (20)</th>

                    <th>Exam (40)</th>

                    <th>B/F</th>

                    <th>Total</th>

                    <th>Grade</th>

                    <th>Status</th>

                    <th></th>

                  </tr>

                </thead>


                <tbody>


                  ${classStudents.map(
                    (student, index) => {

                      const resultData =
                        resultDocs[index].exists
                          ? resultDocs[index].data()
                          : {};


                      const status =
                        resultData.status ||
                        "draft";


                      const isLocked =

                        status === "submitted" ||
                        status === "approved" ||
                        status === "published";


                      return `

                        <tr
                          data-student="${esc(student.id)}"
                          data-locked="${isLocked ? "1" : "0"}"
                        >


                          <td>

                            <b>
                              ${esc(
                                student.fullName ||
                                student.name ||
                                "Unnamed Student"
                              )}
                            </b>

                          </td>


                          <td>

                            <input
                              class="score-input"
                              data-f="test1"
                              type="number"
                              min="0"
                              max="20"
                              value="${resultData.test1 ?? ""}"
                              ${isLocked ? "disabled" : ""}
                            >

                          </td>


                          <td>

                            <input
                              class="score-input"
                              data-f="test2"
                              type="number"
                              min="0"
                              max="20"
                              value="${resultData.test2 ?? ""}"
                              ${isLocked ? "disabled" : ""}
                            >

                          </td>


                          <td>

                            <input
                              class="score-input"
                              data-f="test3"
                              type="number"
                              min="0"
                              max="20"
                              value="${resultData.test3 ?? ""}"
                              ${isLocked ? "disabled" : ""}
                            >

                          </td>


                          <td>

                            <input
                              class="score-input"
                              data-f="exam"
                              type="number"
                              min="0"
                              max="40"
                              value="${resultData.exam ?? ""}"
                              ${isLocked ? "disabled" : ""}
                            >

                          </td>


                          <td>

                            <input
                              class="score-input"
                              data-f="bf"
                              type="number"
                              min="0"
                              value="${resultData.bf ?? 0}"
                              ${isLocked ? "disabled" : ""}
                            >

                          </td>


                          <td class="er-total">

                            ${resultData.total ?? "—"}

                          </td>


                          <td class="er-grade">

                            ${esc(
                              resultData.grade ||
                              "—"
                            )}

                          </td>


                          <td>

                            <span
                              class="badge badge-${esc(status)}"
                            >

                              ${esc(status)}

                            </span>

                          </td>


                          <td>

                            ${
                              status === "draft"
                                ? `<button type="button" class="btn icon-btn" data-del-draft="${esc(student.id)}" title="Delete this draft">🗑️</button>`
                                : ""
                            }

                          </td>


                        </tr>

                      `;

                    }

                  ).join("")}


                </tbody>


              </table>


            </div>


            <p
              class="small-note"
              style="margin-top:10px;"
            >

              Draft scores can be saved and reopened for editing, or

              deleted, at any time before you submit. Once submitted,

              scores are locked until reviewed by the Principal/Admin —

              if a submission is rejected it unlocks automatically for

              you to correct and resubmit.

            </p>


          </div>

        `;


        /* -----------------------------------------------------
           CALCULATE TOTAL AND GRADE
        ----------------------------------------------------- */

        function recalculateRow(row) {

          const getScore = field => {

            const input =
              $(
                `input[data-f="${field}"]`,
                row
              );

            return input
              ? (
                  parseFloat(input.value) || 0
                )
              : 0;

          };


          const test1 =
            getScore("test1");

          const test2 =
            getScore("test2");

          const test3 =
            getScore("test3");

          const exam =
            getScore("exam");


          const total =
            test1 +
            test2 +
            test3 +
            exam;


          const gradeData =
            computeGradeFromScore(
              total,
              gradingScale
            );


          const totalCell =
            $(".er-total", row);

          const gradeCell =
            $(".er-grade", row);


          if (totalCell) {

            totalCell.textContent =
              total;

          }


          if (gradeCell) {

            gradeCell.textContent =
              gradeData.grade;

          }

        }


        /*
          ADD SCORE INPUT EVENTS
        */

        $all(
          "#er-table tbody tr"
        ).forEach(row => {

          $all(
            "input.score-input",
            row
          ).forEach(input => {

            input.addEventListener(
              "input",
              () => {

                let max =
                  parseFloat(input.max);

                let value =
                  parseFloat(input.value);


                if (
                  !Number.isNaN(max) &&
                  !Number.isNaN(value) &&
                  value > max
                ) {

                  input.value = max;

                }


                if (
                  !Number.isNaN(value) &&
                  value < 0
                ) {

                  input.value = 0;

                }


                recalculateRow(row);

              }
            );

          });

        });


        /*
          CALCULATE EXISTING ROWS
        */

        $all(
          "#er-table tbody tr"
        ).forEach(row => {

          if (
            row.dataset.locked !== "1"
          ) {

            recalculateRow(row);

          }

        });


        /* -----------------------------------------------------
           DELETE A SINGLE DRAFT
        ----------------------------------------------------- */

        $all("[data-del-draft]").forEach(btn => {

          btn.onclick = async () => {

            const confirmed = await confirmDialog(
              "Delete this draft result? This cannot be undone.",
              "Delete Draft"
            );

            if (!confirmed) return;

            const sid = btn.dataset.delDraft;

            const resultId =
              `${sid}_${subjectId}_${session.id}_${selectedTerm}`;

            try {
              await db.collection("results").doc(resultId).delete();
              await logAudit("delete_draft_result", {studentId: sid, classId, subjectId, term: selectedTerm});
              toast("Draft deleted", "success");
              loadTable();
            } catch (error) {
              toast(error.message || "Unable to delete draft.", "error");
            }

          };

        });


        /* -----------------------------------------------------
           SAVE RESULTS
        ----------------------------------------------------- */

        async function saveResults(newStatus) {

          const rows =
            $all(
              "#er-table tbody tr"
            );


          const batch =
            db.batch();


          let count = 0;


          rows.forEach(row => {

            if (
              row.dataset.locked === "1"
            ) {
              return;
            }


            const studentId =
              row.dataset.student;


            const getScore = field => {

              const input =
                $(
                  `input[data-f="${field}"]`,
                  row
                );


              if (!input) {
                return 0;
              }


              const value =
                input.value;


              return value === ""
                ? 0
                : (
                    parseFloat(value) || 0
                  );

            };


            const test1 =
              getScore("test1");

            const test2 =
              getScore("test2");

            const test3 =
              getScore("test3");

            const exam =
              getScore("exam");

            const bf =
              getScore("bf");


            const total =
              test1 +
              test2 +
              test3 +
              exam;

            const cumScore =
              total + bf;


            const gradeData =
              computeGradeFromScore(
                total,
                gradingScale
              );


            const resultId =
              `${studentId}_${subjectId}_${session.id}_${selectedTerm}`;


            const resultRef =
              db.collection("results")
                .doc(resultId);


            batch.set(

              resultRef,

              {

                studentId,

                subjectId,

                subjectName:
                  assignment.subjectName,

                classId,

                className:
                  assignment.className,

                sessionId:
                  session.id,

                sessionName:
                  session.name,

                term:
                  selectedTerm,

                test1,

                test2,

                test3,

                exam,

                bf,

                total,

                cumScore,

                grade:
                  gradeData.grade,

                gradeRemark:
                  gradeData.remark,

                status:
                  newStatus,

                rejectionReason:
                  firebase.firestore.FieldValue.delete(),

                teacherId:
                  state.user
                    ? state.user.uid
                    : "",

                teacherName:
                  state.profile
                    ? (
                        state.profile.name ||
                        ""
                      )
                    : "",

                updatedAt:
                  nowStamp()

              },

              {
                merge: true
              }

            );


            count++;

          });


          if (!count) {

            toast(
              "Nothing to save.",
              "error"
            );

            return;

          }


          try {

            await batch.commit();


            await logAudit(

              newStatus === "submitted"
                ? "submit_results"
                : "save_draft_results",

              {

                classId,

                subjectId,

                term:
                  selectedTerm,

                count

              }

            );


            toast(

              newStatus === "submitted"
                ? "Results submitted for review"
                : "Draft saved. You can reopen and edit it any time before submitting.",

              "success"

            );


            loadTable();

          } catch (error) {

            console.error(
              "Error saving results:",
              error
            );


            toast(
              error.message ||
              "Unable to save results.",
              "error"
            );

          }

        }


        /* -----------------------------------------------------
           SAVE DRAFT BUTTON
        ----------------------------------------------------- */

        const saveDraftButton =
          $("#er-save-draft");


        if (saveDraftButton) {

          saveDraftButton.onclick =
            () => {

              saveResults("draft");

            };

        }


        /* -----------------------------------------------------
           SUBMIT BUTTON
        ----------------------------------------------------- */

        const submitButton =
          $("#er-submit");


        if (submitButton) {

          submitButton.onclick =
            async () => {

              const confirmed =
                await confirmDialog(

                  "Submit these results for Principal review? You will not be able to edit them until they are reviewed.",

                  "Submit"

                );


              if (confirmed) {

                saveResults(
                  "submitted"
                );

              }

            };

        }


      } catch (error) {

        console.error(
          "Enter Results error:",
          error
        );


        tableWrap.innerHTML = `

          <div class="empty-state">

            <div class="big">⚠️</div>

            Unable to load the result table.

            <br>

            <small>
              ${esc(
                error.message ||
                "Unknown error"
              )}
            </small>

          </div>

        `;

      }

    }


    /* ---------------------------------------------------------
       EVENTS
    --------------------------------------------------------- */

    assignmentSelect.addEventListener(
      "change",
      loadTable
    );


    termSelect.addEventListener(
      "change",
      () => {

        state.currentTerm =
          termSelect.value;

        loadTable();

      }
    );


    /*
      IMPORTANT:

      We do NOT automatically load a table
      until the user selects Class + Subject.

      This prevents the old blank/null errors.
    */

  } catch (error) {

    console.error(
      "renderEnterResults error:",
      error
    );


    content.innerHTML = `

      <div class="empty-state">

        <div class="big">⚠️</div>

        Unable to load Enter Results.

        <br>

        <small>
          ${esc(
            error.message ||
            "Unknown error"
          )}
        </small>

      </div>

    `;

  }

}

   21. APPROVE & PUBLISH (Principal / Admin)
   ========================================================================= */
async function renderApproveResults(content){
  const [classes, session] = await Promise.all([fetchAll("classes","name"), getCurrentSession()]);
  if(!session){ content.innerHTML = `<div class="empty-state">No academic session configured yet.</div>`; return; }
  content.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h3>Approve &amp; Publish Results</h3></div>
    <div class="field-row">
      <div class="field"><label>Class</label><select id="ap-class"><option value="">Select a class…</option>${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Term</label><select id="ap-term">${TERMS.map(t=>`<option value="${t.id}" ${t.id===state.currentTerm?'selected':''}>${t.label}</option>`).join("")}</select></div>
    </div>
  </div>
  <div id="ap-body"></div>`;

  async function load(){
    const classId = $("#ap-class").value;
    const term = $("#ap-term").value;
    if(!classId){ $("#ap-body").innerHTML = ""; return; }
    $("#ap-body").innerHTML = `<div class="empty-state">Loading…</div>`;
    const [resultsSnap, studentsSnap] = await Promise.all([
      db.collection("results").where("classId","==",classId).where("sessionId","==",session.id).where("term","==",term).get(),
      db.collection("students").where("classId","==",classId).get()
    ]);
    const results = resultsSnap.docs.map(d=>({id:d.id,...d.data()}));
    const students = studentsSnap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.status!=="archived");

    // group by student
    const byStudent = {};
    students.forEach(s=> byStudent[s.id] = {student:s, subjects:[]});
    results.forEach(r=>{ if(byStudent[r.studentId]) byStudent[r.studentId].subjects.push(r); });

    // compute class-wide average per student for position
    const withAvg = Object.values(byStudent).map(x=>{
      const totals = x.subjects.map(s=>s.total).filter(n=>typeof n==='number');
      const avg = totals.length ? totals.reduce((a,b)=>a+b,0)/totals.length : null;
      return {...x, avg};
    }).sort((a,b)=> (b.avg??-1) - (a.avg??-1));
    let pos=0, lastAvg=null, rankMap={};
    withAvg.forEach((x,i)=>{
      if(x.avg===null){ rankMap[x.student.id]="—"; return; }
      if(x.avg !== lastAvg){ pos = i+1; lastAvg = x.avg; }
      rankMap[x.student.id] = pos;
    });

    const termRemarksSnap = await Promise.all(students.map(s=> db.collection("termRemarks").doc(`${s.id}_${session.id}_${term}`).get()));
    const trMap = {}; students.forEach((s,i)=> trMap[s.id] = termRemarksSnap[i].exists ? termRemarksSnap[i].data() : {});

    $("#ap-body").innerHTML = `
    <div class="panel">
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Subjects Recorded</th><th>Avg</th><th>Position</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${Object.values(byStudent).map(x=>{
        const submittedCount = x.subjects.filter(s=>s.status==="submitted").length;
        const allApproved = x.subjects.length>0 && x.subjects.every(s=>s.status==="approved"||s.status==="published");
        const anyPublished = x.subjects.some(s=>s.status==="published");
        const anyRejected = x.subjects.some(s=>s.status==="rejected");
        const tr = trMap[x.student.id] || {};
        return `<tr>
          <td>${esc(x.student.fullName)}</td>
          <td>${x.subjects.length} recorded (${submittedCount} submitted)</td>
          <td>${x.avg? x.avg.toFixed(1):'—'}</td>
          <td>${rankMap[x.student.id]}</td>
          <td>${anyPublished? '<span class="badge badge-published">Published</span>' : allApproved? '<span class="badge badge-approved">Approved</span>' : anyRejected? '<span class="badge badge-rejected">Rejected</span>' : '<span class="badge badge-submitted">Pending</span>'}</td>
          <td>
            <button class="btn btn-outline btn-sm" data-remark="${x.student.id}">Term Record</button>
            <button class="btn btn-outline btn-sm" data-approve="${x.student.id}">Approve</button>
            <button class="btn btn-danger btn-sm" data-reject="${x.student.id}">Reject</button>
            <button class="btn btn-primary btn-sm" data-publish="${x.student.id}" ${!tr.principalRemark?'disabled title="Add Principal remark first"':''}>Publish</button>
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);">No students in this class.</td></tr>`}
      </tbody></table></div>
    </div>`;

    $all("[data-remark]").forEach(b=> b.onclick = ()=> openTermRecordModal(b.dataset.remark, session.id, term, trMap[b.dataset.remark]||{}, ()=>load()));
    $all("[data-approve]").forEach(b=> b.onclick = async ()=>{
      const sid = b.dataset.approve;
      const subj = byStudent[sid].subjects.filter(s=>s.status==="submitted");
      if(!subj.length){ toast("No submitted results to approve for this student.","error"); return; }
      const batch = db.batch();
      subj.forEach(s=> batch.update(db.collection("results").doc(s.id), {status:"approved", approvedBy: state.profile.name, approvedAt: nowStamp()}));
      await batch.commit();
      await logAudit("approve_results", {studentId:sid, term, count:subj.length});
      toast("Results approved","success"); load();
    });
    $all("[data-reject]").forEach(b=> b.onclick = async ()=>{
      const sid = b.dataset.reject;
      const subj = byStudent[sid].subjects.filter(s=>s.status==="submitted"||s.status==="approved");
      if(!subj.length){ toast("No submitted/approved results to reject for this student.","error"); return; }
      const reason = await promptDialog("Why are you rejecting these results? This note will be visible to the subject teacher, and the results will unlock for them to edit and resubmit.", "Reject Results");
      if(reason===null) return;
      const batch = db.batch();
      subj.forEach(s=> batch.update(db.collection("results").doc(s.id), {status:"rejected", rejectionReason: reason||"", rejectedBy: state.profile.name, rejectedAt: nowStamp()}));
      await batch.commit();
      await logAudit("reject_results", {studentId:sid, term, count:subj.length, reason});
      toast("Results rejected and sent back to the teacher","success"); load();
    });
    $all("[data-publish]").forEach(b=> b.onclick = async ()=>{
      const sid = b.dataset.publish;
      if(await confirmDialog("Publish this student's result? It will become visible to the parent/student and via the public Result Checker.", "Publish")){
        await publishStudentResult(sid, session, term, byStudent[sid], rankMap[sid], trMap[sid]);
        toast("Result published","success"); load();
      }
    });
  }
  $("#ap-class").addEventListener("change", load);
  $("#ap-term").addEventListener("change", load);
}

function remarkPickerHtml(kind, fieldId, existingValue){
  const options = REMARK_SUGGESTIONS[kind] || [];
  const isPreset = options.includes(existingValue);
  return `
    <select id="${fieldId}-select">
      <option value="">— Choose a suggested remark —</option>
      ${options.map(o=>`<option value="${esc(o)}" ${existingValue===o?'selected':''}>${esc(o)}</option>`).join("")}
      <option value="__other__" ${(!isPreset && existingValue) ? 'selected' : ''}>Other (type manually)</option>
    </select>
    <textarea id="${fieldId}-custom" rows="2" placeholder="Type your own remark…" style="margin-top:8px;${(!isPreset && existingValue) ? '' : 'display:none;'}">${esc((!isPreset && existingValue) ? existingValue : '')}</textarea>
  `;
}
function wireRemarkPicker(fieldId, body){
  const select = $(`#${fieldId}-select`, body);
  const custom = $(`#${fieldId}-custom`, body);
  if(!select || !custom) return;
  select.addEventListener("change", ()=>{
    if(select.value === "__other__"){ custom.style.display = "block"; custom.focus(); }
    else { custom.style.display = "none"; }
  });
}
function getRemarkValue(fieldId, body){
  const select = $(`#${fieldId}-select`, body);
  const custom = $(`#${fieldId}-custom`, body);
  if(!select) return "";
  if(select.value === "__other__") return (custom ? custom.value.trim() : "");
  return select.value;
}

   practical/psychomotor skills, promotion (3rd term only), award, and

  const isPrincipal = role === "principal" || isAdmin;
  const isClassTeacher = isAdmin || (role === "teacher" && state.profile.classTeacherOf) || isPrincipal;
  const isThirdTerm = term === "third";

  const characterVals = existing.characterDevelopment || {};
  const practicalVals = existing.practicalSkills || {};
  const psychomotorVals = existing.psychomotorSkills || {};

  openModal("Student Term Record", `
    <div class="field-row">
      <div class="field"><label>Days Present</label><input type="number" id="rm-present" value="${existing.attendancePresent??''}" ${isClassTeacher?'':'disabled'}></div>
